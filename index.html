<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0D0D0D" />
    <script>
      try {
        var t = localStorage.getItem('ph_theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0D0D0D' : '#FAFAFA');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/jpeg" href="/images/orabiLogo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="مطعم عرابي - بيتزا، ساندويتشات، مشويات ومعجنات بمكونات طازجة يومياً | ORABI Restaurant - Pizza, sandwiches, grills & pastries made fresh daily" />
    <meta name="theme-color" content="#0D0D0D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>مطعم عرابي | ORABI Restaurant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
