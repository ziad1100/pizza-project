# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — ORABI Restaurant production backend (FREE TIER ONLY)
#
# Intended usage:  render blueprints validate ./render.yaml   (v2 CLI)
#
# Final free-tier architecture (no paid resources anywhere):
#   • Vercel Free   → frontend (orabi-restaurant.vercel.app)
#   • Render Free   → API Web Service (Express + Node via the existing Dockerfile)
#   • Neon Free     → production PostgreSQL (project "orabi-restaurant", branch
#                     "production") — created manually in the Neon console, NOT
#                     by this blueprint. `DATABASE_URL` is a secret set in the
#                     Render dashboard (or via `render services create --env-var`).
#
# NO paid resources are defined here — no Redis (Key Value), no background
# worker, no one-off job, no Render-managed Postgres. The application is fully
# functional without Redis: the cache is best-effort, emails send inline, and
# /health/ready reports "redis: disabled". The BullMQ worker and analytics
# rollup are the only features unavailable on the free tier.
#
# The menu/catalog seed is a one-time, idempotent step run against Neon
# (`NODE_ENV=production npm run seed` from the repo, or
# `node server/dist/seed.js` inside the built image). In production the seed is
# safe and idempotent: it applies migrations, creates the real menu
# (categories, products, offers, coupons, banners, branches, zones, posts,
# gallery, settings) and then skips on subsequent runs. It NEVER creates demo
# users/orders/reviews in production and hard-blocks SEED_RESET=1. The server
# also applies pending migrations on every boot.
#
# Secrets with `sync: false` are intentionally NOT managed from this file —
# set real values in the Render dashboard (or via the CLI/API) after launch.
# Nothing sensitive is ever committed to git.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── API Web Service — builds the existing Dockerfile ──────────────────────
  - type: web
    name: pizzaproject-api
    runtime: docker
    repo: https://github.com/ziad1100/pizza-project
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Start Command: leave unset — the Dockerfile CMD
    # (`node server/dist/server.js`) applies migrations on boot and serves the
    # API. The menu seed is run once against Neon before the first deploy
    # (idempotent; safe to re-run).
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none" # frontend (Vercel) and API (Render) are different domains
      - key: PG_MAX_POOL_SIZE
        value: "10" # stays well under the Neon free connection limit
      # ── Secrets — set in the Render dashboard after launch, never in git ──
      - key: DATABASE_URL # Neon connection string (project orabi-restaurant, branch production)
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL # https://orabi-restaurant.vercel.app
        sync: false
      - key: ADMIN_REGISTER_CODE # used to create the first admin via /register
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CALLBACK_URL
        sync: false
