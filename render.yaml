# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — ORABI Restaurant production backend (FREE TIER ONLY)
#
# Intended usage:  render blueprints validate ./render.yaml   (v2 CLI)
# Provisioning:    render postgres create + render services create (free plan)
#
# Creates the complete backend stack using ONLY free-tier resources:
#   • production PostgreSQL  (free plan — private network, no public exposure)
#   • API Web Service        (free plan — Express + Node via the existing
#                             Dockerfile, health check on /health)
#
# NO paid resources are defined here — no Redis (Key Value), no background
# worker, no one-off job. The application is fully functional without Redis:
# the cache is best-effort, emails send inline, and /health/ready reports
# "redis: disabled". The BullMQ worker and analytics rollup are the only
# features unavailable on the free tier (see docs/DEPLOYMENT.md).
#
# The menu/catalog seed runs as part of the web service start command
# (`node server/dist/seed.js && node server/dist/server.js`). In production the
# seed is safe and idempotent: it applies migrations, creates the real menu
# (categories, products, offers, coupons, banners, branches, zones, posts,
# gallery, settings) and then skips on subsequent boots. It NEVER creates demo
# users/orders/reviews in production and hard-blocks SEED_RESET=1.
#
# DATABASE_URL is injected automatically by Render (fromDatabase) — the
# internal connection string, reachable only from Render services.
#
# PLANS (free): web services sleep after ~15 min idle; free Postgres expires
# after 30 days. Secrets with `sync: false` are intentionally NOT managed from
# this file — set real values in the Render dashboard (or via the CLI/API)
# after launch. Nothing sensitive is ever committed to git.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Production PostgreSQL (separate from the local Docker database) ──────
  - type: postgres
    name: pizzaproject-db
    database: pizza
    user: pizza
    plan: free
    ipAllowList: [] # private network only — no public database domain

  # ── API Web Service — builds the existing Dockerfile ──────────────────────
  - type: web
    name: pizzaproject-api
    runtime: docker
    repo: https://github.com/ziad1100/pizza-project
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Start Command (set at creation via the CLI/dashboard, not here — the v2
    # blueprint validator rejects startCommand on docker runtime):
    #   sh -c "node server/dist/seed.js && node server/dist/server.js"
    # Seeds the real menu on first boot (idempotent — skips when data exists),
    # then starts the API. Replaces the paid one-off seed job.
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pizzaproject-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none" # frontend (Vercel) and API (Render) are different domains
      # ── Secrets — set in the Render dashboard after launch, never in git ──
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL # https://<your-app>.vercel.app — set after Vercel deploy
        sync: false
      - key: ADMIN_REGISTER_CODE # used to create the first admin via /register
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CALLBACK_URL
        sync: false
